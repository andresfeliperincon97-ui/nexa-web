<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: transparent;
  padding: 0 2px 12px 2px;
  color: #C8E8DF;
  overflow-x: hidden;
}

.hint {
  text-align: center;
  color: #3A6A8C;
  font-size: 12px;
  padding: 4px 0 14px 0;
  user-select: none;
  letter-spacing: 0.3px;
}

.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  min-height: 60px;
}

/* ── Card ── */
.card {
  background: #0A1826;
  border: 2px solid #1A3A5C;
  border-radius: 13px;
  padding: 13px;
  cursor: grab;
  width: 168px;
  flex-shrink: 0;
  position: relative;
  transition: border-color .2s, box-shadow .2s;
  user-select: none;
  -webkit-user-select: none;
}
.card:hover {
  border-color: #1D9E75;
  box-shadow: 0 5px 20px rgba(29,158,117,.3);
}

/* SortableJS states */
.card.sortable-ghost {
  opacity: 0.3;
  border: 2px dashed #1D9E75 !important;
  background: #071420;
}
.card.sortable-chosen {
  cursor: grabbing;
}
.card.sortable-drag {
  opacity: 0.96;
  box-shadow: 0 16px 40px rgba(0,0,0,.75), 0 0 0 2px #1D9E75;
  transform: rotate(2.5deg) scale(1.05);
  cursor: grabbing;
  z-index: 9999;
}

/* ── Thumbnail ── */
.thumb {
  width: 100%;
  border-radius: 7px;
  display: block;
  margin-bottom: 9px;
  pointer-events: none;
  background: #071420;
}
.thumb-placeholder {
  width: 100%;
  height: 120px;
  border-radius: 7px;
  background: linear-gradient(145deg, #0D1E30 0%, #162840 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  margin-bottom: 9px;
}

/* ── Card text ── */
.fname {
  font-size: 12px;
  font-weight: 600;
  color: #C8E8DF;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 8px;
}
.meta { display: flex; gap: 5px; flex-wrap: wrap; }
.badge {
  font-size: 10px;
  color: #4ABFA0;
  background: #050E19;
  border: 1px solid #1A3A5C;
  border-radius: 20px;
  padding: 2px 8px;
}

/* ── Order pin ── */
.order-pin {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #1D9E75;
  color: white;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 2px 10px rgba(29,158,117,.55);
  pointer-events: none;
  transition: background .2s;
}

/* ── Loading / error states ── */
.status-msg {
  text-align: center;
  color: #3A6A8C;
  font-size: 13px;
  padding: 24px;
}
</style>
</head>
<body>

<div class="hint">☰ &nbsp;Arrastra las tarjetas para cambiar el orden de unión</div>
<div id="grid" class="grid">
  <div class="status-msg">Cargando tarjetas…</div>
</div>

<!-- SortableJS from jsDelivr CDN (no external tracking) -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>

<script>
(function () {
  "use strict";

  var items   = [];
  var sortInst = null;

  /* ── Render cards ─────────────────────────────────────── */
  function renderGrid() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    if (!items || items.length === 0) {
      grid.innerHTML = '<div class="status-msg">Sin archivos cargados.</div>';
      return;
    }

    items.forEach(function (item, idx) {
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-name", item.name);

      var thumbHtml = (item.thumb && item.thumb.length > 0)
        ? '<img class="thumb" src="data:image/png;base64,' + item.thumb + '" draggable="false"/>'
        : '<div class="thumb-placeholder">📄</div>';

      var shortName = item.name.length > 20
        ? item.name.substring(0, 19) + "…"
        : item.name;

      card.innerHTML =
        thumbHtml +
        '<div class="fname" title="' + escHtml(item.name) + '">' + escHtml(shortName) + '</div>' +
        '<div class="meta">' +
          '<span class="badge">📄 ' + item.pages + ' pág.</span>' +
          '<span class="badge">💾 ' + item.size + '</span>' +
        '</div>' +
        '<div class="order-pin">' + (idx + 1) + '</div>';

      grid.appendChild(card);
    });

    initSortable();
  }

  /* ── SortableJS ───────────────────────────────────────── */
  function initSortable() {
    var grid = document.getElementById("grid");
    if (sortInst) { sortInst.destroy(); }

    if (typeof Sortable === "undefined") {
      grid.innerHTML = '<div class="status-msg">⚠️ No se pudo cargar la librería de arrastre. Revisa tu conexión a internet.</div>';
      return;
    }

    sortInst = Sortable.create(grid, {
      animation: 200,
      ghostClass:  "sortable-ghost",
      chosenClass: "sortable-chosen",
      dragClass:   "sortable-drag",
      onEnd: function () {
        refreshPins();
        sendValue();
      }
    });
  }

  /* ── Update order numbers ─────────────────────────────── */
  function refreshPins() {
    var cards = document.querySelectorAll("#grid .card");
    cards.forEach(function (card, idx) {
      var pin = card.querySelector(".order-pin");
      if (pin) { pin.textContent = idx + 1; }
    });
  }

  /* ── Send order back to Streamlit ─────────────────────── */
  function sendValue() {
    var cards = document.querySelectorAll("#grid .card");
    var order = Array.from(cards).map(function (c) {
      return c.getAttribute("data-name");
    });
    window.parent.postMessage(
      { type: "streamlit:setComponentValue", value: order, dataType: "json" },
      "*"
    );
  }

  /* ── Set iframe height ────────────────────────────────── */
  function setHeight() {
    // Wait a tick so layout is done
    setTimeout(function () {
      var h = document.body.scrollHeight + 20;
      window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*");
    }, 80);
  }

  /* ── Receive data from Streamlit ──────────────────────── */
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") { return; }
    items = (event.data.args && event.data.args.items) ? event.data.args.items : [];
    renderGrid();
    setHeight();
    sendValue(); // send initial default order
  });

  /* ── Signal component is ready ────────────────────────── */
  window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");

  /* ── HTML escaping helper ─────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

}());
</script>
</body>
</html>
